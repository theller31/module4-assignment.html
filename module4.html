<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Module 4 HTML Assignment</title>
  <style>
    /* Simple styling for readability */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
      display: flex;
      gap: 15px;
      background-color: #f4f4f4;
      padding: 10px;
    }

    nav ul li {
      display: inline;
    }

    form {
      margin-top: 30px;
    }

    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }

    img.rounded {
      border-radius: 10px;
      margin-top: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    .section {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="section">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Contact Form -->
  <section class="section">
    <h2>Contact Us</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <!-- Bonus: Radio Buttons -->
      <label>How did you find us?</label>
      <input type="radio" id="google" name="source" value="google" />
      <label for="google">Google</label>
      <input type="radio" id="social" name="source" value="social" />
      <label for="social">Social Media</label>

      <br><br>
      <button type="submit">Submit</button>
    </form>
  </section>

  <!-- Product Table -->
  <section class="section">
    <h2>Our Products</h2>
    <table>
      <!-- Bonus: Header Row -->
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Price</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Notebook</td>
          <td>$2.50</td>
          <td>100</td>
        </tr>
        <tr>
          <td>Pen Pack</td>
          <td>$5.00</td>
          <td>200</td>
        </tr>
        <tr>
          <td>Desk Lamp</td>
          <td>$12.99</td>
          <td>50</td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- Images -->
  <section class="section">
    <h2>Gallery</h2>
    <img src="https://placehold.co/300x200" alt="Placeholder image" />

    <!-- Bonus: Rounded Image -->
    <img src="https://placehold.co/300x200" class="rounded" alt="Rounded placeholder image" />
  </section>

</body>
</html>
