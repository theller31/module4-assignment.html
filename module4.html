<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Module 4 HTML Assignment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    nav ul {
      list-style-type: none;
      padding: 0;
      background-color: #333;
      overflow: hidden;
    }
    nav ul li {
      display: inline;
      padding: 14px 20px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
    }
    nav ul li a:hover {
      text-decoration: underline;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #aaa;
    }
    th {
      background-color: #f4f4f4;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    img.rounded {
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!--  Navigation Bar -->
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!--  Contact Form -->
  <h2>Contact Us</h2>
  <form>
    <label for="name">Name:</label><br />
    <input type="text" id="name" name="name" required /><br /><br />

    <label for="email">Email:</label><br />
    <input type="email" id="email" name="email" required /><br /><br />

    <label for="message">Message:</label><br />
    <textarea id="message" name="message" rows="5" cols="30" required></textarea><br /><br />

    <!--  Bonus: Radio Button Group -->
    <label>How did you find us?</label><br />
    <input type="radio" id="google" name="source" value="Google" />
    <label for="google">Google</label><br />
    <input type="radio" id="social" name="source" value="Social Media" />
    <label for="social">Social Media</label><br /><br />

    <button type="submit">Submit</button>
  </form>

  <!--  Product Table -->
  <h2>Product Inventory</h2>
  <table>
    <!-- 🏷 Bonus: Header Row -->
    <tr>
      <th>Product Name</th>
      <th>Price</th>
      <th>Quantity</th>
    </tr>
    <tr>
      <td>Wireless Mouse</td>
      <td>$15.99</td>
      <td>25</td>
    </tr>
    <tr>
      <td>USB-C Charger</td>
      <td>$19.99</td>
      <td>40</td>
    </tr>
    <tr>
      <td>Bluetooth Speaker</td>
      <td>$29.99</td>
      <td>18</td>
    </tr>
  </table>

  <!-- 🖼 Images Section -->
  <h2>Featured Images</h2>
  <img src="https://placehold.co/300x200" alt="Placeholder Image 1" />
  <!-- ⭐ Bonus: Rounded Image -->
  <img src="https://placehold.co/300x200" alt="Rounded Image" class="rounded" />

</body>
</html>
